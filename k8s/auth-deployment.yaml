apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: practice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: shoaib5023/auth-service:1.0.0
          ports:
            - containerPort: 8082
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kubernetes
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: product-jwt-secret
                  key: JWT_SECRET
          envFrom:
            - configMapRef:
                name: microservices-config
