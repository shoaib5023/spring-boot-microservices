apiVersion: v1
kind: ConfigMap
metadata:
  name: microservices-config
  namespace: practice
data:
  SPRING_PROFILES_ACTIVE: "kubernetes"

  # Auth Service
  AUTH_SERVER_PORT: "8082"
  AUTH_DB_URL: "jdbc:mysql://auth-db:3306/lloyds_products"

  # Product Service
  PRODUCT_SERVER_PORT: "8083"
  PRODUCT_DB_URL: "jdbc:mysql://product-db:3306/lloyds_products"

  # API Gateway
  GATEWAY_SERVER_PORT: "8080"
  AUTH_SERVICE_URL: "http://auth-service:8082"
  PRODUCT_SERVICE_URL: "http://product-service:8083"
  GATEWAY_SERVICE_URL: "http://api-gateway-service:8080"
