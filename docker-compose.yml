
services:
  auth-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      MYSQL_DATABASE: lloyds
    ports:
      - "3307:3306"
    volumes:
      - auth-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  product-db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in root .env}
      MYSQL_DATABASE: product_db
    ports:
      - "3308:3306"
    volumes:
      - product-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  auth-service:
    build:
      context: ./demo
    ports:
      - "8082:8082"
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://auth-db:3306/auth_db}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in root .env}
      SPRING_ADMIN_USER_NAME: ${SPRING_ADMIN_USER_NAME}
      SPRING_ADMIN_PASSWORD: ${SPRING_ADMIN_PASSWORD}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION}
    depends_on:
      auth-db:
        condition: service_healthy
    restart: unless-stopped

  product-service:
    build:
      context: ./product-service
    ports:
      - "8083:8083"
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://product-db:3306/product_db}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in root .env}
    depends_on:
      product-db:
        condition: service_healthy
    restart: unless-stopped

  auth-frontend:
    build:
      context: ./auth-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_AUTH_API_URL: http://localhost:8082/api/auth
      VITE_PRODUCT_API_URL: http://localhost:8083/api/products
    depends_on:
      - auth-service
    restart: unless-stopped

  product-frontend:
    build:
      context: ./product-frontend
    ports:
      - "5174:5174"
    environment:
      VITE_AUTH_API_URL: http://localhost:8082/api/auth
      VITE_PRODUCT_API_URL: http://localhost:8083/api/products
    depends_on:
      - product-service
    restart: unless-stopped

volumes:
  auth-db-data:
  product-db-data:
